name: Sonarqube pipeline

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: self-hosted

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Run Sonarqube anaysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=NodeApplication
            -Dsonar.sources=.
            -Dsonar.host.url=${{ vars.SONAR_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true

      # - name: Fail Pipeline
      #   run: exit 1
