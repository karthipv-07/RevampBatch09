name: Node Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm install

      - name: Generate .env file
        run: |
          echo "PORT=8080" >> .env.development
          echo "APP=Development-Node-App" >> .env.development
          echo "PORT=5000" >> .env.production
          echo "APP=Production-Node-App" >> .env.production

      - name: Run the Application
        run: |
          node app.js development &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f "node app.js"
        
