name: Environment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the environment
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
      port:
        description: Choose the port
        required: true
        default: "8080"
        type: choice
        options:
          - 8080
          - 5000
  

jobs:
  build:
    runs-on: self-hosted
    environment: prod
    
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Generate .env file
        run: |
          echo "PORT=8080" >> .env.development
          echo "APP=Development-Node-App" >> .env.development
          echo "PORT=5000" >> .env.production
          echo "APP=Production-Node-App" >> .env.production

      - name: Run the Application
        run: |
          node app.js ${{ github.event.inputs.environment }} &
          sleep 5
          curl http://localhost:${{ github.event.inputs.port }}
          curl http://localhost:${{ github.event.inputs.port }}/health
          pkill -f "node app.js"
        
